<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esther's Bookshop | Order Online & In-Store Pickup</title>
  <meta name="description" content="Esther's Bookshop - Browse curated books, order online, pay securely, and pick up at our Boston store with your digital QR pass.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: {
              850: '#5c2306',
              900: '#451a03',
            },
            parchment: {
              50: '#fdfbf7',
              100: '#fef3c7',
              200: '#fde68a',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', '"Cormorant Garamond"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="src/index.css">

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX support -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- QRCode.js CDN for Digital Pass generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-[#fdfbf7] text-stone-900 min-h-screen selection:bg-amber-100 selection:text-amber-900">

  <!-- Root Mounting Container for React Application -->
  <div id="root"></div>

  <!-- Load Data and Main Application Scripts -->
  <script type="module" src="src/data/booksData.js"></script>
  <script type="module" src="src/data/storesData.js"></script>
  
  <!-- Main Babel React Application -->
  <script type="text/babel" data-type="module" src="src/app.js"></script>

</body>
</html>
